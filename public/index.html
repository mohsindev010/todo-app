<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <p class="eyebrow">STAY ORGANIZED</p>
    <h1>My To-Do List</h1>
    <p class="subtitle">Add a task and make today productive.</p>
    <form id="taskForm" class="input-area">
      <input id="taskInput" type="text" placeholder="What do you need to do?" maxlength="200" required>
      <button type="submit">Add task</button>
    </form>
    <p id="status" class="status" role="status"></p>
    <ul id="taskList"></ul>
    <p id="emptyMessage" class="empty">No tasks yet. Add your first task above!</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
